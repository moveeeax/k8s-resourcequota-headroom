name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -covermode=atomic ./...
      - name: Build
        run: go build -ldflags "-X github.com/moveeeax/k8s-resourcequota-headroom/cmd.version=${GITHUB_REF_NAME}" -o k8s-resourcequota-headroom .
      - name: Smoke test (offline fixture)
        run: |
          ./k8s-resourcequota-headroom scan --input examples/fixtures/quotas.json --output json
          # --fail-on critical must exit non-zero on the fixture (pods at 96%)
          if ./k8s-resourcequota-headroom scan --input examples/fixtures/quotas.json --warn 70 --critical 90 --fail-on critical; then
            echo "expected non-zero exit on critical finding" && exit 1
          fi
